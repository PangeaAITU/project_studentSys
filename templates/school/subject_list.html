{% extends "base.html" %}
{% block title %}Subjects{% endblock %}

{% block content %}

<h2 class="mb-3">📚 Subjects</h2>

<div class="row g-3">

  {% for subject in subjects %}
    <div class="col-md-4">
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <h5>{{ subject.name }}</h5>
          <p class="text-muted">{{ subject.description|default:"No description" }}</p>
        </div>
      </div>
    </div>
  {% empty %}
    <p>No subjects yet</p>
  {% endfor %}

</div>

{% endblock %}
