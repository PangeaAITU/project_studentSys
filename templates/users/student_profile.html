{% extends "base.html" %}

{% block content %}

<div class="card">
    <h2>Student profile</h2>

    <p>Username: <span class="badge">{{ request.user.username }}</span></p>

    <h3>Grades</h3>

    {% if grades %}
        <div>
            {% for g in grades %}
                <div class="grade">{{ g.subject.name }} — <b>{{ g.value }}</b></div>
            {% endfor %}
        </div>
    {% else %}
        <p>No grades yet</p>
    {% endif %}
</div>

{% endblock %}
