{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>Login</h2>

    {% if err %}
        <p style="color:red;">{{ err }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <p>Username:</p>
        <input name="username">

        <p>Password:</p>
        <input name="password" type="password">

        <br><br>
        <button type="submit">Log in</button>
    </form>
</div>
{% endblock %}
