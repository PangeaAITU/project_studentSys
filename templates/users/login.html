{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>Login</h2>

    {% if err %}
        <p class="error">{{ err }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <p>Username</p>
        <input class="inp" name="username">

        <p>Password</p>
        <input class="inp" type="password" name="password">

        <br><br>
        <button class="btn" type="submit">Log in</button>
    </form>
</div>
{% endblock %}
