{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Login | Student Management System</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg">

<div class="login-box">

    <div class="login-head">
        <div class="login-logo">Student Management System</div>
        <div class="login-sub">Sign in</div>
    </div>

    <div class="login-switch">
        <a class="sw-btn active" href="/users/login/">User</a>
        <a class="sw-btn" href="/admin/login/">Admin</a>
    </div>

    {% if err %}
        <div class="msg">{{ err }}</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div class="field">
            <div class="label">Username</div>
            <input class="inp" name="username">
        </div>

        <div class="field">
            <div class="label">Password</div>
            <input class="inp" type="password" name="password">
        </div>

        <button class="btn w100" type="submit">Log in</button>
    </form>

</div>

</body>
</html>
