{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}

{% block content %}

<div class="row mb-4">
  <div class="col text-center">
    <h1 class="fw-bold">Student Management System</h1>
    <p class="text-muted">Smart Student Management System</p>
  </div>
</div>

<div class="row g-4">

  <div class="col-md-4">
    <div class="card shadow-sm h-100">
      <div class="card-body text-center">
        <h5 class="card-title">Students</h5>
        <p class="card-text">Student and Profile Management</p>
        <a href="{% url 'student_list' %}" class="btn btn-outline-primary">Open</a>
      </div>
    </div>
  </div>

  <div class="col-md-4">
    <div class="card shadow-sm h-100">
      <div class="card-body text-center">
        <h5 class="card-title">Subjects</h5>
        <p class="card-text">List of disciplines</p>
        <a href="{% url 'subject_list' %}" class="btn btn-outline-success">Open</a>
      </div>
    </div>
  </div>

  <div class="col-md-4">
    <div class="card shadow-sm h-100">
      <div class="card-body text-center">
        <h5 class="card-title">Grades</h5>
        <p class="card-text">Estimates and statistics</p>
        <a href="{% url 'grade_list' %}" class="btn btn-outline-warning">Open</a>
      </div>
    </div>
  </div>

</div>

{% endblock %}
